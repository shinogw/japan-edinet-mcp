# Smithery MCP Server Configuration
# https://smithery.ai

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      edinetApiKey:
        type: string
        description: "EDINET API Key from https://api.edinet-fsa.go.jp"
    required:
      - edinetApiKey
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['dist/index.js'],
      env: {
        EDINET_API_KEY: config.edinetApiKey
      }
    })
